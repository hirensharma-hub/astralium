plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { create(mod_id) { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, 'astralium.refmap.json'
    config 'astralium.mixins.json'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    runtimeOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.2.0.27')
    compileOnly fg.deobf('maven.modrinth:jade:11.7.1')
    runtimeOnly fg.deobf('maven.modrinth:jade:11.7.1')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('processResources').configure {
    dependsOn tasks.named('compileJava')
    from(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')) {
        rename { 'astralium.refmap.json' }
    }
    def props = [minecraft_version: minecraft_version, forge_version: forge_version,
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.attributes([
        'Specification-Title': mod_id,
        'Specification-Vendor': mod_authors,
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Implementation-Vendor': mod_authors
    ])
}

publishing {
    publications { register('mavenJava', MavenPublication) { artifact jar } }
    repositories { maven { url = layout.buildDirectory.dir('repo') } }
}
